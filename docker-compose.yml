services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: gps_mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/auth/passwordfile:/mosquitto/auth/passwordfile:ro
      - ./mosquitto/auth/aclfile:/mosquitto/auth/aclfile:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gps_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  mqtt-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gps_mqtt_worker
    env_file:
      - .env
    depends_on:
      - mosquitto
    volumes:
      - .:/app
    command: python -m mqtt_worker.main
    restart: unless-stopped
