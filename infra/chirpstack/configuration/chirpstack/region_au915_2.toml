# AU915 sub-band 3 (channels 16-23 + 66) configuration for ChirpStack MQTT gateway backend.
[[regions]]
id="au915_2"
description="AU915 sub-band 3 (channels 16-23 + 66)"
common_name="AU915"

  [regions.gateway]
  force_gws_private=false

    [regions.gateway.backend]
    enabled="mqtt"

      [regions.gateway.backend.mqtt]
      topic_prefix="$LORAWAN_TOPIC_PREFIX"
      server="ssl://$EMQX_MQTT_HOST:$EMQX_MQTT_PORT/"
      username="$EMQX_MQTT_USERNAME"
      password="$EMQX_MQTT_PASSWORD"
      qos=0
      clean_session=false
      keep_alive_interval="30s"
      ca_cert=""
      tls_cert=""
      tls_key=""

  [[regions.gateway.channels]]
    frequency=918400000
    bandwidth=125000
    modulation="LORA"
    spreading_factors=[7, 8, 9, 10, 11, 12]

  [[regions.gateway.channels]]
    frequency=918600000
    bandwidth=125000
    modulation="LORA"
    spreading_factors=[7, 8, 9, 10, 11, 12]

  [[regions.gateway.channels]]
    frequency=918800000
    bandwidth=125000
    modulation="LORA"
    spreading_factors=[7, 8, 9, 10, 11, 12]

  [[regions.gateway.channels]]
    frequency=919000000
    bandwidth=125000
    modulation="LORA"
    spreading_factors=[7, 8, 9, 10, 11, 12]

  [[regions.gateway.channels]]
    frequency=919200000
    bandwidth=125000
    modulation="LORA"
    spreading_factors=[7, 8, 9, 10, 11, 12]

  [[regions.gateway.channels]]
    frequency=919400000
    bandwidth=125000
    modulation="LORA"
    spreading_factors=[7, 8, 9, 10, 11, 12]

  [[regions.gateway.channels]]
    frequency=919600000
    bandwidth=125000
    modulation="LORA"
    spreading_factors=[7, 8, 9, 10, 11, 12]

  [[regions.gateway.channels]]
    frequency=919800000
    bandwidth=125000
    modulation="LORA"
    spreading_factors=[7, 8, 9, 10, 11, 12]

  [[regions.gateway.channels]]
    frequency=919100000
    bandwidth=500000
    modulation="LORA"
    spreading_factors=[8]

  [regions.network]
  installation_margin=10
  rx_window=0
  rx1_delay=1
  rx1_dr_offset=0
  rx2_dr=8
  rx2_frequency=923300000
  rx2_prefer_on_rx1_dr_lt=0
  rx2_prefer_on_link_budget=false
  downlink_tx_power=-1
  adr_disabled=false
  min_dr=0
  max_dr=5
  enabled_uplink_channels=[16, 17, 18, 19, 20, 21, 22, 23, 66]

    [regions.network.rejoin_request]
    enabled=false
    max_count_n=0
    max_time_n=0

    [regions.network.class_b]
    ping_slot_dr=8
    ping_slot_frequency=0
